<?xml version="1.0" encoding="utf-8"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd" [
	<!ENTITY stroke_color "#010101">
	<!ENTITY fill_color "#FFFFFF">
]>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" width="55px" height="55px" viewBox="0 0 55 55">
    <g stroke="&fill_color;" stroke-linejoin="round" stroke-linecap="round">
        
        <!-- Player 1 (Left side, looping UP to capture area) -->
        <rect x="4" y="28.5" width="10" height="10" fill="&fill_color;" stroke="none" rx="1" />
        <path d="M 14 33.5 L 24 33.5 L 24 16.5 L 9 16.5 L 9 22.5" fill="none" stroke-width="3" />
        <rect x="6" y="19.5" width="6" height="6" fill="&fill_color;" stroke="none" rx="1" />

        <!-- Player 2 (Right side, charging straight left) -->
        <rect x="41" y="28.5" width="10" height="10" fill="&fill_color;" stroke="none" rx="1" />
        <path d="M 41 33.5 L 36 33.5" fill="none" stroke-width="3" />
        <rect x="30" y="30.5" width="6" height="6" fill="&fill_color;" stroke="none" rx="1" />
        
    </g>
</svg>
